<div class="surface-0 flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="grid justify-content-center p-2 lg:p-0" style="min-width:80%">
        <div class="col-12 mt-5 xl:mt-0 text-center">
            <img src="assets/layout/images/{{layoutService.isDarkTheme() ? 'logo-white' : 'logo-dark'}}.svg" alt="Sakai logo" class="mb-5" style="width:81px; height:60px;">                
        </div>
        <div class="col-12 xl:col-6" style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="h-full w-full m-0 py-7 px-4" style="border-radius:53px; background: linear-gradient(180deg, var(--surface-50) 38.9%, var(--surface-0));">
                <div class="text-center mb-5">
                    <div class="text-900 text-3xl font-medium mb-3">Auto - Care</div>
                    <span class="text-600 font-medium">Connectez pour continuer</span>
                </div>

                <div class="w-full md:w-10 mx-auto">
                    <form [formGroup]="componentForm" (ngSubmit)="submit()">

                        <div class="form-group" [ngClass]="{'invalid': isFieldInvalid('email')}">
                            <label for="email" class="block text-900 text-xl font-medium mb-2">Email</label>
                            <input 
                                formControlName="email"
                                id="email" type="text"
                                placeholder="Adresse email"
                                pInputText
                                class="w-full mb-3"
                                style="padding:1rem;"
                            />
                            <div class="error-message" *ngIf="isFieldInvalid('email')">
                                <p *ngIf="f['email']?.errors?.['required']">
                                    L'email est requis
                                </p>
                                <p *ngIf="f['email']?.errors?.['email']">
                                    Entrer un email valide
                                </p>
                            </div>
                        </div>
    
                        <div class="form-group" [ngClass]="{'invalid': isFieldInvalid('password')}">
                            <label for="password" class="block text-900 font-medium text-xl mb-2">Mot de passe</label>
                            <p-password 
                                formControlName="password"
                                id="password"
                                placeholder="Mot de passe"
                                [feedback]="false"
                                [toggleMask]="true"
                                styleClass="p-password p-component p-inputwrapper p-input-icon-right mb-3"
                                [style]="{'width':'100%'}"
                                [inputStyle]="{'width':'100%'}">
                            </p-password>
                            <div class="error-message" *ngIf="isFieldInvalid('password')">
                                <p *ngIf="f['password']?.errors?.['required']">
                                    Le mot de passe est requis
                                </p>
                            </div>
                        </div>
    
                        <p-messages [value]="errorMessages"></p-messages>
                        
                        <button pButton type="submit" [disabled]="!componentForm.valid" pRipple label="Se connecter" class="w-full p-3 mt-5 text-xl"></button>
                        
                        <p class="m-0 text-center my-3">ou</p>

                        <div id="google-button" class="w-full flex justify-content-center"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
