<p-toast position="top-right"></p-toast>

<div class="layout-topbar">
    <a class="layout-topbar-logo" routerLink="">
        <img src="assets/layout/images/{{layoutService.isDarkTheme() ? 'logo-white' : 'logo-dark'}}.svg" alt="logo">
        <span>AUTO - CARE</span>
    </a>

    <button #menubutton class="p-link layout-menu-button layout-topbar-button" (click)="layoutService.onMenuToggle()">
        <i class="pi pi-bars"></i>
    </button>
    
    <button #topbarmenubutton class="p-link layout-topbar-menu-button layout-topbar-button" (click)="layoutService.showProfileSidebar()">
        <i class="pi pi-ellipsis-v"></i>
    </button>
    
    <div #topbarmenu class="layout-topbar-menu" [ngClass]="{'layout-topbar-menu-mobile-active': layoutService.state.profileSidebarVisible}">
        <p-overlayPanel #notificationPanel>
            <div *ngIf="notifications.length > 0; else noNotifications">
                <div *ngFor="let notification of notifications" class="p-ai-center p-p-2 border-b">
                        <hr>
                        <div>{{ notification.message }}</div>
                        <small class="text-gray-500">{{ notification.createdAt | date: "dd/mm/YYYY HH:MM:ss" }}</small>
                </div>
            </div>
            <ng-template #noNotifications>
                <div class="p-p-2 text-gray-500">Aucune notification</div>
            </ng-template>
        </p-overlayPanel>
        <button class="p-link layout-topbar-button" (click)="showNotifications($event)">
            <i class="pi pi-bell"></i>
            <p class="md:ml-1 mr-2 mb-0 text-red-500" *ngIf="unreadCount > 0">
                <b>{{ unreadCount }}</b>
            </p>
            <span>Notifications</span>
        </button>

        <button class="p-link layout-topbar-button" (click)="layoutService.toggleDarkMode()">
            <i [ngClass]="{ 'pi ': true, 'pi-moon': layoutService.isDarkTheme(), 'pi-sun': !layoutService.isDarkTheme() }"></i>
            <span>Thème</span>
        </button>

        <button class="p-link layout-topbar-button">
            <i class="pi pi-user"></i>
            <span>{{ userName() }}</span>
        </button>

        <button class="p-link layout-topbar-button" (click)="logOut()">
            <i class="pi pi-sign-out text-red-500"></i>
            <span>Se deconnecter</span>
        </button>
    </div>
</div>
