<div class="grid">
    <div class="col-12">
        <div class="card">
            <p-toolbar>
                <ng-template pTemplate="left">
                    <h5>Historique des transactions</h5>
                </ng-template>

                <ng-template pTemplate="right">
                    <div class="flex flex-wrap gap-4">
                        <span class="p-float-label">
                            <p-calendar id="fromDate" [(ngModel)]="fromDate" [showIcon]="true" dateFormat="dd/mm/yy"></p-calendar>
                            <label for="fromDate">Date de début</label>
                        </span>
                    
                        <span class="p-float-label">
                            <p-calendar id="toDate" [(ngModel)]="toDate" [showIcon]="true" dateFormat="dd/mm/yy"></p-calendar>
                            <label for="toDate">Date de fin</label>
                        </span>
                    
                        <button pButton pRipple label="Filtrer" icon="pi pi-filter" class="p-button-primary" (click)="onFilter()"></button>
                    </div>
                </ng-template>
            </p-toolbar>
            

            <p-table #dt [value]="transactions" [loading]="loadingTransactions" [rowHover]="true" [paginator]="true" [rows]="pageSize"
                [totalRecords]="totalRecords" [lazy]="true" (onPage)="onPageChange($event)" responsiveLayout="scroll">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Montant</th>
                    </tr>
                </ng-template>
            
                <ng-template pTemplate="body" let-transaction>
                    <tr>
                        <td>{{ transaction.transactionDate | date: 'dd/MM/yyyy à HH:mm:ss' }}</td>
                        <td>{{ transaction.description }}</td>
                        <td class="text-right">{{ transaction.amount | number:'1.0-2':'fr' }}</td>
                    </tr>
                </ng-template>

                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="4" class="text-center">Aucune transaction trouvée.</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
