<div class="card">
    <h5>Liste des services</h5>
    <p-table #dt 
        [value]="services"
        [loading]="loadingServices"
        [paginator]="true"
        [rows]="pageSize"
        [rowHover]="true"
        [totalRecords]="totalRecords"
        [lazy]="true"
        (onPage)="onPageChange($event)"
        (onFilter)="onFilterChange($event)"
        responsiveLayout="scroll"
    >
        <ng-template pTemplate="header">
            <tr>
                <th>
                    <div class="flex justify-content-between align-items-center">
                        Nom
                        <p-columnFilter type="text" field="name" display="menu" [showOperator]="false" [showAddButton]="false" [matchModeOptions]="nameFilterOptions" placeholder="Recherche par nom"></p-columnFilter>
                    </div>
                </th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-service>
            <tr>
                <td>{{ service.name }}</td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="1" class="text-center">No services found.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
