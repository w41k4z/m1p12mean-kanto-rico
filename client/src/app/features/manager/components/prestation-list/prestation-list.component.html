<style>
    .confirmation-content {
    display: flex;
    align-items: center;
    justify-content: center;
}
</style>
<div class="card">
    <p-toolbar>
        <ng-template pTemplate="left">
            <h5>Liste des prestations</h5>
        </ng-template>
        <ng-template pTemplate="right">
            <p-button label="Créer un prestation" icon="pi pi-plus" class="p-button-success"
                (click)=createNewPrestation()></p-button>
        </ng-template>
    </p-toolbar>

    <p-table #dt [value]="prestations" [loading]="loadingPrestations" [paginator]="true" [rows]="pageSize"
        [rowHover]="true" [totalRecords]="totalRecords" [lazy]="true" (onPage)="onPageChange($event)"
        (onSort)="onSortChange($event)" responsiveLayout="scroll">
        <ng-template pTemplate="header">
            <tr>
                <th>
                    <div class="flex justify-content-between align-items-center">
                        Nom
                        <p-columnFilter type="text" field="name" display="menu" [showOperator]="false"
                            [showAddButton]="false" [matchModeOptions]="nameFilterOptions"
                            placeholder="Recherche par nom"></p-columnFilter>
                    </div>
                </th>
                <th pSortableColumn="price">
                    <div class="flex justify-content-between align-items-center">
                        Prix
                        <!-- <p-sortIcon field="price"></p-sortIcon> -->
                    </div>
                </th>
                <th style="width: 10%"></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-prestation>
            <tr>
                <td>{{ prestation.name }}</td>
                <td>{{ prestation.price }}</td>
                <td>
                    <div class="flex gap-2">
                        <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-sm p-button-text"
                            (click)="showEditDialog(prestation)"></button>

                        <button pButton pRipple icon="pi pi-trash"
                            class="p-button-rounded p-button-sm p-button-text p-button-danger"
                            (click)="deletePrestation(prestation)" pTooltip="Supprimer" tooltipPosition="top"></button>
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="4" class="text-center">No prestations found.</td>
            </tr>
        </ng-template>
    </p-table>

    <!-- Create Dialog -->
    <p-dialog [(visible)]="dialogVisible" header="Créer un prestation" [modal]="true" [style]="{width: '50vw'}"
        class="p-fluid">
        <ng-template pTemplate="content">
            <div class="field">
                <label for="prestationName">Nom du Prestation </label>
                <input id="prestationName" pInputText type="text" [(ngModel)]="newPrestation.name" required autofocus>
            </div>
            <div class="field">
                <label for="prestationPrice">Prix </label>
                <input id="prestationPrice" pInputText type="text" [(ngModel)]="newPrestation.price" required autofocus>
                <small *ngIf="priceError" class="p-error">
                    {{ priceError }}
                </small>
            </div>
        </ng-template>
        <ng-template pTemplate="footer">
            <button pButton type="button" label="Annuler" (click)="dialogVisible = false"
                class="p-button-danger"></button>
            <p-button label="Valider" icon="pi pi-check" (click)="submitPrestation()"
                class="p-button-primary"></p-button>
        </ng-template>
    </p-dialog>

    <!-- Edit Dialog -->
    <p-dialog [(visible)]="editDialogVisible" header="Modifier Prestation" [modal]="true" [style]="{width: '50vw'}"
        *ngIf="selectedPrestation" class="p-fluid">
        <ng-template pTemplate="content">
            <div class="field">
                <label for="editPrestationName">Nom</label>
                <input id="editPrestationName" pInputText type="text" [(ngModel)]="selectedPrestation.name" required>
            </div>
            <div class="field">
                <label for="editPrestationPrice">Prix</label>
                <input id="editPrestationPrice" pInputText type="number" [(ngModel)]="selectedPrestation.price"
                    required>
            </div>
        </ng-template>
        <ng-template pTemplate="footer">
            <button pButton type="button" label="Annuler" (click)="editDialogVisible = false"
                class="p-button-text"></button>
            <button pButton type="button" label="Enregistrer" (click)="updatePrestation()"
                class="p-button-primary"></button>
        </ng-template>
    </p-dialog>
     <!-- Delete dialog-->
     <p-dialog [(visible)]="deleteDialogVisible" header="Confirmation" [modal]="true" [style]="{width: '350px'}">
        <ng-template pTemplate="content">
            <div class="confirmation-content">
                <i class="pi pi-exclamation-triangle mr-3" style="font-size: 2rem"></i>
                <span>Êtes-vous sûr de vouloir supprimer ce prestatition ?</span>
            </div>
        </ng-template>
        <ng-template pTemplate="footer">
            <button pButton type="button" label="Non" (click)="deleteDialogVisible = false"
                class="p-button-text"></button>
            <button pButton type="button" label="Oui" (click)="confirmDelete()" class="p-button-danger"></button>
        </ng-template>
    </p-dialog>
</div>
